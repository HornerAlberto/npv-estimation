[project]
name = "npv-estimation"
version = "0.1.0"
description = "NPV model and Streamlit app for the value proposition of an internal R&D project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "streamlit>=1.66.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=9.1.1",
]
